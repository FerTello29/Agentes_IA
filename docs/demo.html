<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo · Control de asistencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f5fb;
      --surface: #ffffff;
      --surface-2: #f1f3f9;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .06);
      --focus: #a78bfa;

      --hero-1: #4338ca;
      --hero-2: #7c3aed;
      --hero-3: #c026d3;

      --presente: #15803d;
      --presente-suave: #dcfce7;
      --ausente: #b91c1c;
      --ausente-suave: #fee2e2;
      --justificado: #b45309;
      --justificado-suave: #fef3c7;
      --suspension: #0e7490;
      --suspension-suave: #cffafe;

      --radio: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --surface: #121a2e;
        --surface-2: #1a2440;
        --text: #e5e9f5;
        --muted: #94a3b8;
        --line: #26324f;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);

        --presente-suave: rgba(34, 197, 94, .16);
        --ausente-suave: rgba(239, 68, 68, .16);
        --justificado-suave: rgba(245, 158, 11, .16);
        --suspension-suave: rgba(6, 182, 212, .16);
      }
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 110px;
    }

    button, input { font-family: inherit; }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .envoltura {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ---------- Encabezado ---------- */

    .hero {
      position: relative;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(600px 300px at 90% -10%, rgba(255, 255, 255, .22), transparent 60%),
        radial-gradient(500px 260px at -10% 120%, rgba(244, 114, 182, .45), transparent 60%),
        linear-gradient(135deg, var(--hero-1), var(--hero-2) 55%, var(--hero-3));
      padding: 22px 0 18px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 14px 40px rgba(76, 29, 149, .28);
    }

    .hero-fila {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      flex: none;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .3);
      backdrop-filter: blur(6px);
    }

    .logo svg { width: 26px; height: 26px; }

    .ceja {
      margin: 0 0 2px;
      font-size: .74rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      opacity: .85;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 4.6vw, 1.9rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -.02em;
    }

    .detalle-sesion {
      margin: 14px 0 0;
      font-size: .92rem;
      opacity: .92;
      min-height: 1.2em;
    }

    /* Anillo de progreso */
    .anillo {
      position: relative;
      flex: none;
      width: 76px;
      height: 76px;
    }

    .anillo svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .anillo circle { fill: none; stroke-width: 8; }
    .anillo .pista { stroke: rgba(255, 255, 255, .22); }
    .anillo .valor {
      stroke: white;
      stroke-linecap: round;
      transition: stroke-dashoffset .5s ease;
    }

    .anillo-texto {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      line-height: 1;
    }

    .anillo-texto strong { font-size: 1.15rem; font-weight: 800; }
    .anillo-texto span { font-size: .62rem; opacity: .85; margin-top: 3px; }

    /* Selector de sesiones */
    .sesiones {
      display: flex;
      gap: 8px;
      margin: 16px -16px 0;
      padding: 4px 16px 6px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
    }

    .sesiones::-webkit-scrollbar { display: none; }

    .pildora {
      position: relative;
      flex: none;
      scroll-snap-align: start;
      min-width: 70px;
      padding: 9px 12px 8px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .28);
      background: rgba(255, 255, 255, .12);
      color: white;
      cursor: pointer;
      text-align: center;
      transition: transform .15s ease, background .15s ease;
    }

    .pildora:hover { background: rgba(255, 255, 255, .22); }
    .pildora:active { transform: scale(.96); }

    .pildora-num {
      display: block;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .pildora-fecha {
      display: block;
      font-size: .7rem;
      opacity: .85;
      white-space: nowrap;
    }

    .pildora .punto {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #86efac;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, .08);
    }

    .pildora[aria-selected="true"] {
      background: white;
      color: var(--hero-2);
      border-color: white;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
    }

    .pildora[aria-selected="true"] .pildora-fecha { opacity: .75; }
    .pildora[aria-selected="true"] .punto { background: var(--presente); }

    /* ---------- Resumen ---------- */

    .resumen {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .tile {
      position: relative;
      overflow: hidden;
      padding: 14px;
      border-radius: var(--radio);
      background: var(--surface);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }

    .tile::before {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--color);
    }

    .tile-cabecera {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 600;
    }

    .tile-icono {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--suave);
      color: var(--color);
    }

    .tile-icono svg { width: 16px; height: 16px; }

    .tile strong {
      display: block;
      margin-top: 8px;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .barra {
      display: flex;
      height: 10px;
      margin-top: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .barra span {
      height: 100%;
      background: var(--color);
      transition: width .4s ease;
    }

    [data-estado="PRESENTE"]    { --color: var(--presente);    --suave: var(--presente-suave); }
    [data-estado="AUSENTE"]     { --color: var(--ausente);     --suave: var(--ausente-suave); }
    [data-estado="JUSTIFICADO"] { --color: var(--justificado); --suave: var(--justificado-suave); }
    [data-estado="SUSPENSION"]  { --color: var(--suspension);  --suave: var(--suspension-suave); }

    /* ---------- Barra de herramientas ---------- */

    .herramientas {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin: 14px -16px 0;
      padding: 10px 16px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px);
    }

    .buscador {
      position: relative;
    }

    .buscador svg {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .buscador input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      box-shadow: var(--shadow);
    }

    .todos {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .todos-etiqueta {
      padding: 0 6px 0 8px;
      font-size: .78rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .btn-todos {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--suave);
      color: var(--color);
      cursor: pointer;
      transition: transform .12s ease;
    }

    .btn-todos:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-todos:disabled { opacity: .4; cursor: not-allowed; }
    .btn-todos svg { width: 18px; height: 18px; }

    /* ---------- Lista de participantes ---------- */

    .lista {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .tarjeta {
      position: relative;
      padding: 14px;
      border-radius: var(--radio);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      container-type: inline-size;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .tarjeta::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 14px;
      bottom: 14px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--color);
    }

    .tarjeta.modificada {
      border-color: color-mix(in srgb, var(--color) 55%, var(--line));
    }

    .persona {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      min-width: 0;
    }

    .avatar {
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: .9rem;
      color: var(--color);
      background: var(--suave);
      transition: background .2s ease, color .2s ease;
    }

    .persona-datos { min-width: 0; }

    .nombre {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      color: var(--muted);
      font-size: .8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .marca-cambio {
      margin-left: auto;
      flex: none;
      font-size: .68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      visibility: hidden;
    }

    .tarjeta.modificada .marca-cambio { visibility: visible; }

    .opciones {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin: 0;
      padding: 0;
      border: 0;
      min-width: 0;
    }

    @container (min-width: 420px) {
      .opciones { grid-template-columns: repeat(4, 1fr); }
    }

    .opcion {
      position: relative;
      display: block;
    }

    .opcion input {
      position: absolute;
      inset: 0;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .opcion span {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 6px 8px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-size: .84rem;
      font-weight: 700;
      user-select: none;
      transition: background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
    }

    .opcion span svg { width: 16px; height: 16px; flex: none; }

    .opcion:hover span {
      border-color: var(--color);
      color: var(--color);
    }

    .opcion input:active + span { transform: scale(.97); }

    .opcion input:focus-visible + span {
      outline: 3px solid var(--focus);
      outline-offset: 1px;
    }

    .opcion input:checked + span {
      background: var(--color);
      border-color: var(--color);
      color: white;
      box-shadow: 0 6px 14px color-mix(in srgb, var(--color) 35%, transparent);
    }

    .vacio {
      grid-column: 1 / -1;
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
    }

    .vacio svg { width: 42px; height: 42px; opacity: .5; }

    /* Esqueleto de carga */
    .esqueleto {
      height: 130px;
      border-radius: var(--radio);
      background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%);
      background-size: 200% 100%;
      animation: brillo 1.2s ease-in-out infinite;
      border: 1px solid var(--line);
    }

    @keyframes brillo {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    /* ---------- Barra de guardado ---------- */

    .guardado {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 10;
      width: min(720px, calc(100% - 24px));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 10px 10px 18px;
      border-radius: 20px;
      background: rgba(15, 23, 42, .92);
      color: white;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, .35);
    }

    .guardado-estado {
      flex: 1;
      min-width: 0;
      font-size: .88rem;
      line-height: 1.25;
    }

    .guardado-estado strong { display: block; font-size: .95rem; }
    .guardado-estado span { opacity: .7; }

    .btn-guardar {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 50px;
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--hero-2), var(--hero-3));
      box-shadow: 0 8px 20px rgba(192, 38, 211, .35);
      cursor: pointer;
      transition: transform .12s ease, opacity .2s ease;
    }

    .btn-guardar:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-guardar:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .btn-guardar svg { width: 18px; height: 18px; }

    .girando { animation: giro .8s linear infinite; }
    @keyframes giro { to { transform: rotate(360deg); } }

    .guardado.pendiente .guardado-estado strong::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: #fbbf24;
      vertical-align: middle;
      animation: pulso 1.4s ease-in-out infinite;
    }

    @keyframes pulso { 50% { opacity: .3; } }

    /* ---------- Notificación ---------- */

    .aviso {
      position: fixed;
      left: 50%;
      top: 16px;
      z-index: 20;
      max-width: calc(100% - 24px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: 0 18px 40px rgba(15, 23, 42, .2);
      font-weight: 600;
      font-size: .92rem;
      transform: translate(-50%, -140%);
      opacity: 0;
      visibility: hidden;
      transition: transform .3s cubic-bezier(.2, .9, .3, 1.2), opacity .2s ease, visibility .3s;
    }

    .aviso.visible { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
    .aviso svg { width: 20px; height: 20px; flex: none; color: var(--color); }

    /* ---------- Puntos de quiebre ---------- */

    @media (min-width: 760px) {
      .envoltura { padding: 0 24px; }
      .sesiones { margin: 18px -24px 0; padding: 4px 24px 6px; }
      .herramientas { margin: 16px -24px 0; padding: 12px 24px; }
      .lista { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .hero { padding: 28px 0 22px; }
      .anillo { width: 92px; height: 92px; }
      .anillo-texto strong { font-size: 1.35rem; }
    }

    @media (min-width: 1100px) {
      .lista { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 560px) {
      .resumen { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .tile { padding: 12px; }
      .tile strong { font-size: 1.45rem; margin-top: 6px; }
      .herramientas { grid-template-columns: 1fr; }
      .todos { justify-content: space-between; }
      .btn-todos { flex: 1; }
      .btn-guardar { padding: 0 16px; }
    }

    @media (max-width: 420px) {
      .btn-guardar .texto-largo { display: none; }
    }

    @media (max-width: 340px) {
      .guardado-estado span { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="envoltura">
      <div class="hero-fila">
        <div class="marca">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8.5 15l2.2 2.2L15.5 13"/></svg>
          </div>
          <div>
            <p class="ceja">Inteligencia Artificial aplicada a las TIC</p>
            <h1>Control de asistencia</h1>
          </div>
        </div>

        <div class="anillo" title="Porcentaje de asistencia de la sesión">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="pista" cx="50" cy="50" r="42"/>
            <circle class="valor" id="anilloValor" cx="50" cy="50" r="42"
                    stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
          </svg>
          <div class="anillo-texto">
            <strong id="porcentaje">0%</strong>
            <span>asistencia</span>
          </div>
        </div>
      </div>

      <p class="detalle-sesion" id="detalleSesion">Cargando sesiones…</p>

      <nav class="sesiones" id="sesiones" role="tablist" aria-label="Sesiones"></nav>
    </div>
  </header>

  <main class="envoltura">
    <section class="resumen" id="resumen" aria-label="Resumen de la sesión"></section>
    <div class="barra" id="barra" aria-hidden="true"></div>

    <div class="herramientas">
      <label class="buscador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="buscar" type="search" placeholder="Buscar por nombre o ID" autocomplete="off" aria-label="Buscar participante">
      </label>

      <div class="todos" id="todos" role="group" aria-label="Marcar a todos">
        <span class="todos-etiqueta">Todos</span>
      </div>
    </div>

    <section class="lista" id="lista" aria-live="polite"></section>
  </main>

  <div class="guardado" id="barraGuardado">
    <div class="guardado-estado" id="estadoGuardado">
      <strong>Selecciona una sesión</strong>
      <span>Elige una sesión para comenzar</span>
    </div>
    <button class="btn-guardar" id="guardar" onclick="guardar()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
      <span>Guardar<span class="texto-largo"> asistencia</span></span>
    </button>
  </div>

  <div class="aviso" id="aviso" role="status"></div>

  <script src="mock.js"></script>

  <script>
    const ICONOS = {
      PRESENTE: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
      AUSENTE: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
      JUSTIFICADO: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
      SUSPENSION: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.7 5.7l12.6 12.6"/></svg>',
      buscar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
      error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>',
      girando: '<svg class="girando" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>'
    };

    const ESTADOS = [
      { valor: 'PRESENTE',    etiqueta: 'Asistió',      todos: 'Todos asistieron' },
      { valor: 'AUSENTE',     etiqueta: 'Faltó',        todos: 'Todos faltaron' },
      { valor: 'JUSTIFICADO', etiqueta: 'Justificante', todos: 'Todos con justificante' },
      { valor: 'SUSPENSION',  etiqueta: 'Suspensión',   todos: 'Suspensión de clases' }
    ];

    const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    const CIRCUNFERENCIA = 2 * Math.PI * 42;

    let sesiones = [];
    let participantes = [];
    let originales = new Map();
    let sesionActual = null;
    let guardando = false;
    let temporizadorAviso = null;

    document.addEventListener('DOMContentLoaded', () => {
      construirControles();
      cargarSesiones();
    });

    document.getElementById('buscar').addEventListener('input', filtrar);

    window.addEventListener('beforeunload', evento => {
      if (cambiosPendientes() > 0) {
        evento.preventDefault();
        evento.returnValue = '';
      }
    });

    /* ---------- Construcción inicial ---------- */

    function construirControles() {
      const resumen = document.getElementById('resumen');
      const barra = document.getElementById('barra');
      const todos = document.getElementById('todos');

      ESTADOS.forEach(e => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.estado = e.valor;
        tile.innerHTML =
          `<div class="tile-cabecera"><span class="tile-icono">${ICONOS[e.valor]}</span>${e.etiqueta}</div>` +
          '<strong>0</strong>';
        resumen.appendChild(tile);

        const segmento = document.createElement('span');
        segmento.dataset.estado = e.valor;
        segmento.style.width = '0%';
        barra.appendChild(segmento);

        const boton = document.createElement('button');
        boton.type = 'button';
        boton.className = 'btn-todos';
        boton.dataset.estado = e.valor;
        boton.title = e.todos;
        boton.setAttribute('aria-label', e.todos);
        boton.innerHTML = ICONOS[e.valor];
        boton.disabled = true;
        boton.addEventListener('click', () => marcarTodos(e.valor));
        todos.appendChild(boton);
      });
    }

    /* ---------- Sesiones ---------- */

    function cargarSesiones() {
      mostrarEsqueleto();

      google.script.run
        .withSuccessHandler(datos => {
          sesiones = datos || [];
          renderSesiones();

          if (sesiones.length === 0) {
            mostrarVacio('No hay sesiones registradas.');
            document.getElementById('detalleSesion').textContent = 'Sin sesiones';
            return;
          }

          seleccionarSesion(sesionSugerida().id);
        })
        .withFailureHandler(error => {
          mostrarVacio('No se pudieron cargar las sesiones.');
          mostrarError(error);
        })
        .obtenerSesiones();
    }

    // Sesión de hoy o la siguiente; si todas pasaron, la última.
    function sesionSugerida() {
      const hoy = formatoISO(new Date());
      return sesiones.find(s => String(s.fecha) >= hoy) || sesiones[sesiones.length - 1];
    }

    function renderSesiones() {
      const contenedor = document.getElementById('sesiones');
      contenedor.innerHTML = '';

      sesiones.forEach(s => {
        const boton = document.createElement('button');
        boton.type = 'button';
        boton.className = 'pildora';
        boton.setAttribute('role', 'tab');
        boton.setAttribute('aria-selected', String(s.id === sesionActual));
        boton.dataset.id = s.id;
        boton.title = `${s.tema} · ${s.estado}`;

        const numero = document.createElement('span');
        numero.className = 'pildora-num';
        numero.textContent = `S${s.numero}`;

        const fecha = document.createElement('span');
        fecha.className = 'pildora-fecha';
        fecha.textContent = fechaCorta(s.fecha);

        boton.appendChild(numero);
        boton.appendChild(fecha);

        if (s.estado === 'REGISTRADA') {
          const punto = document.createElement('span');
          punto.className = 'punto';
          punto.title = 'Registrada';
          boton.appendChild(punto);
        }

        boton.addEventListener('click', () => seleccionarSesion(s.id));
        contenedor.appendChild(boton);
      });
    }

    function seleccionarSesion(idSesion) {
      if (idSesion === sesionActual || guardando) return;

      if (cambiosPendientes() > 0 &&
          !confirm('Tienes cambios sin guardar. ¿Quieres cambiar de sesión y descartarlos?')) {
        return;
      }

      sesionActual = idSesion;
      participantes = [];
      originales = new Map();
      document.getElementById('buscar').value = '';

      document.querySelectorAll('.pildora').forEach(p => {
        const activa = p.dataset.id === idSesion;
        p.setAttribute('aria-selected', String(activa));
        if (activa) p.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      });

      actualizarDetalleSesion();
      habilitarAcciones(false);
      actualizarResumen();
      mostrarEsqueleto();

      google.script.run
        .withSuccessHandler(datos => {
          if (idSesion !== sesionActual) return;
          participantes = datos || [];
          originales = new Map(participantes.map(p => [p.id, p.estado]));
          renderParticipantes();
          habilitarAcciones(participantes.length > 0);
        })
        .withFailureHandler(error => {
          mostrarVacio('No se pudieron cargar los participantes.');
          mostrarError(error);
        })
        .obtenerParticipantes(idSesion);
    }

    function actualizarDetalleSesion() {
      const s = sesiones.find(x => x.id === sesionActual);
      document.getElementById('detalleSesion').textContent = s
        ? `${s.tema} · ${fechaLarga(s.fecha)} · ${s.estado === 'REGISTRADA' ? 'Registrada' : 'Pendiente'}`
        : '';
    }

    /* ---------- Participantes ---------- */

    function renderParticipantes() {
      const lista = document.getElementById('lista');
      lista.innerHTML = '';

      if (participantes.length === 0) {
        mostrarVacio('No hay participantes activos.');
        actualizarResumen();
        return;
      }

      const fragmento = document.createDocumentFragment();

      participantes.forEach((p, indice) => {
        const tarjeta = document.createElement('article');
        tarjeta.className = 'tarjeta';
        tarjeta.dataset.estado = p.estado;
        tarjeta.dataset.busqueda = `${p.id} ${p.nombre} ${p.correo}`.toLowerCase();

        const persona = document.createElement('div');
        persona.className = 'persona';

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = String(p.id).replace(/\D/g, '') || '?';

        const datos = document.createElement('div');
        datos.className = 'persona-datos';

        const nombre = document.createElement('div');
        nombre.className = 'nombre';
        nombre.textContent = p.nombre;

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${p.id} · ${p.correo}`;

        const cambio = document.createElement('span');
        cambio.className = 'marca-cambio';
        cambio.textContent = 'Editado';

        datos.appendChild(nombre);
        datos.appendChild(meta);
        persona.appendChild(avatar);
        persona.appendChild(datos);
        persona.appendChild(cambio);

        const opciones = document.createElement('fieldset');
        opciones.className = 'opciones';
        opciones.setAttribute('aria-label', `Asistencia de ${p.nombre}`);

        ESTADOS.forEach(e => {
          const opcion = document.createElement('label');
          opcion.className = 'opcion';
          opcion.dataset.estado = e.valor;

          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = `estado-${indice}`;
          radio.value = e.valor;
          radio.checked = p.estado === e.valor;
          radio.addEventListener('change', () => cambiarEstado(indice, e.valor, tarjeta));

          const texto = document.createElement('span');
          texto.innerHTML = ICONOS[e.valor];
          texto.appendChild(document.createTextNode(e.etiqueta));

          opcion.appendChild(radio);
          opcion.appendChild(texto);
          opciones.appendChild(opcion);
        });

        tarjeta.appendChild(persona);
        tarjeta.appendChild(opciones);
        marcarModificada(tarjeta, p);
        fragmento.appendChild(tarjeta);
      });

      lista.appendChild(fragmento);
      filtrar();
      actualizarResumen();
    }

    function cambiarEstado(indice, estado, tarjeta) {
      participantes[indice].estado = estado;
      tarjeta.dataset.estado = estado;
      marcarModificada(tarjeta, participantes[indice]);
      actualizarResumen();
    }

    function marcarModificada(tarjeta, p) {
      tarjeta.classList.toggle('modificada', originales.get(p.id) !== p.estado);
    }

    function marcarTodos(estado) {
      participantes = participantes.map(p => ({ ...p, estado }));
      renderParticipantes();
      const e = ESTADOS.find(x => x.valor === estado);
      mostrarAviso(`${e.todos}. No olvides guardar.`, estado);
    }

    function filtrar() {
      const texto = document.getElementById('buscar').value.trim().toLowerCase();
      const tarjetas = document.querySelectorAll('.tarjeta');
      let visibles = 0;

      tarjetas.forEach(t => {
        const coincide = !texto || t.dataset.busqueda.includes(texto);
        t.hidden = !coincide;
        if (coincide) visibles++;
      });

      const previo = document.getElementById('sinResultados');
      if (previo) previo.remove();

      if (tarjetas.length > 0 && visibles === 0) {
        const vacio = crearVacio(`Sin resultados para “${texto}”.`);
        vacio.id = 'sinResultados';
        document.getElementById('lista').appendChild(vacio);
      }
    }

    /* ---------- Resumen ---------- */

    function actualizarResumen() {
      const total = participantes.length;

      ESTADOS.forEach(e => {
        const cantidad = participantes.filter(p => p.estado === e.valor).length;
        document.querySelector(`.tile[data-estado="${e.valor}"] strong`).textContent = cantidad;
        document.querySelector(`.barra span[data-estado="${e.valor}"]`).style.width =
          total ? `${(cantidad / total) * 100}%` : '0%';
      });

      const presentes = participantes.filter(p => p.estado === 'PRESENTE').length;
      const porcentaje = total ? Math.round((presentes / total) * 100) : 0;
      document.getElementById('porcentaje').textContent = `${porcentaje}%`;
      document.getElementById('anilloValor').style.strokeDashoffset =
        CIRCUNFERENCIA * (1 - porcentaje / 100);
      document.getElementById('anilloValor').style.opacity = porcentaje ? 1 : 0;

      actualizarBarraGuardado(presentes, total);
    }

    function cambiosPendientes() {
      return participantes.filter(p => originales.get(p.id) !== p.estado).length;
    }

    function actualizarBarraGuardado(presentes, total) {
      const barra = document.getElementById('barraGuardado');
      const estado = document.getElementById('estadoGuardado');
      const pendientes = cambiosPendientes();
      const sesion = sesiones.find(s => s.id === sesionActual);

      let titulo;
      let detalle;

      if (!total) {
        titulo = sesionActual ? 'Cargando…' : 'Selecciona una sesión';
        detalle = sesionActual ? 'Obteniendo participantes' : 'Elige una sesión para comenzar';
      } else if (pendientes > 0) {
        titulo = `${pendientes} ${pendientes === 1 ? 'cambio' : 'cambios'} sin guardar`;
        detalle = `Presentes: ${presentes} / ${total}`;
      } else if (sesion && sesion.estado === 'REGISTRADA') {
        titulo = 'Todo guardado';
        detalle = `Presentes: ${presentes} / ${total}`;
      } else {
        titulo = 'Sesión sin registrar';
        detalle = `Presentes: ${presentes} / ${total}`;
      }

      estado.innerHTML = '';
      const fuerte = document.createElement('strong');
      fuerte.textContent = titulo;
      const span = document.createElement('span');
      span.textContent = detalle;
      estado.appendChild(fuerte);
      estado.appendChild(span);

      barra.classList.toggle('pendiente', pendientes > 0);
    }

    /* ---------- Guardado ---------- */

    function guardar() {
      if (!sesionActual || participantes.length === 0 || guardando) return;

      guardando = true;
      habilitarAcciones(false);
      const boton = document.getElementById('guardar');
      const contenidoOriginal = boton.innerHTML;
      boton.innerHTML = `${ICONOS.girando}<span>Guardando…</span>`;

      const idSesion = sesionActual;
      const datos = participantes.map(p => ({ id: p.id, estado: p.estado }));

      google.script.run
        .withSuccessHandler(resultado => {
          guardando = false;
          boton.innerHTML = contenidoOriginal;
          habilitarAcciones(true);

          originales = new Map(datos.map(p => [p.id, p.estado]));
          document.querySelectorAll('.tarjeta.modificada')
            .forEach(t => t.classList.remove('modificada'));

          const sesion = sesiones.find(s => s.id === idSesion);
          if (sesion) sesion.estado = 'REGISTRADA';
          renderSesiones();
          actualizarDetalleSesion();
          actualizarResumen();

          const detalle = ESTADOS
            .filter(e => resultado.conteo[e.valor] > 0)
            .map(e => `${resultado.conteo[e.valor]} ${e.etiqueta.toLowerCase()}`)
            .join(' · ');
          mostrarAviso(`Asistencia guardada: ${detalle}`, 'PRESENTE');
        })
        .withFailureHandler(error => {
          guardando = false;
          boton.innerHTML = contenidoOriginal;
          habilitarAcciones(true);
          mostrarError(error);
        })
        .guardarAsistencia(idSesion, datos);
    }

    function habilitarAcciones(activo) {
      document.getElementById('guardar').disabled = !activo;
      document.querySelectorAll('.btn-todos').forEach(b => b.disabled = !activo);
    }

    /* ---------- Estados visuales ---------- */

    function mostrarEsqueleto() {
      const lista = document.getElementById('lista');
      lista.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const bloque = document.createElement('div');
        bloque.className = 'esqueleto';
        lista.appendChild(bloque);
      }
    }

    function crearVacio(texto) {
      const vacio = document.createElement('div');
      vacio.className = 'vacio';
      vacio.innerHTML = ICONOS.buscar;
      const p = document.createElement('p');
      p.textContent = texto;
      vacio.appendChild(p);
      return vacio;
    }

    function mostrarVacio(texto) {
      const lista = document.getElementById('lista');
      lista.innerHTML = '';
      lista.appendChild(crearVacio(texto));
    }

    function mostrarAviso(texto, estado) {
      const aviso = document.getElementById('aviso');
      aviso.dataset.estado = estado || 'AUSENTE';
      aviso.innerHTML = estado ? ICONOS[estado] : ICONOS.error;
      aviso.appendChild(document.createTextNode(texto));
      aviso.classList.add('visible');

      clearTimeout(temporizadorAviso);
      temporizadorAviso = setTimeout(() => aviso.classList.remove('visible'), 3800);
    }

    function mostrarError(error) {
      const texto = error && error.message ? error.message : String(error);
      mostrarAviso(texto, null);
    }

    /* ---------- Fechas ---------- */

    function formatoISO(fecha) {
      const m = String(fecha.getMonth() + 1).padStart(2, '0');
      const d = String(fecha.getDate()).padStart(2, '0');
      return `${fecha.getFullYear()}-${m}-${d}`;
    }

    function partesFecha(texto) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(texto || ''));
      return m ? { anio: m[1], mes: MESES[Number(m[2]) - 1], dia: m[3] } : null;
    }

    function fechaCorta(texto) {
      const f = partesFecha(texto);
      return f ? `${f.dia} ${f.mes}` : 'sin fecha';
    }

    function fechaLarga(texto) {
      const f = partesFecha(texto);
      return f ? `${f.dia} ${f.mes} ${f.anio}` : 'sin fecha';
    }
  </script>
</body>
</html>
